<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Cercle magique de la révélation (feature 007, charte § 8). Blanc et gris clair seulement :
       le jeu le teinte à la couleur du palier et le fait tourner autour de (200, 200).
       Du bord vers le centre : double anneau et ses losanges (r ≤ 195), bande de glyphes
       géométriques (aucune lettre), anneau gradué, étoile à huit branches (deux carrés) avec
       nœuds, phases de lune et petites étoiles, anneau qui cerne l'orbe (r = 106, tangent aux
       carrés), puis rose des vents, cachée par l'orbe tant qu'elle est là. -->
  <defs>
    <filter id="magic-circle-halo" x="-0.1" y="-0.1" width="1.2" height="1.2">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <radialGradient id="magic-circle-coeur" cx="200" cy="200" r="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </radialGradient>
    <!-- Jours autour des huit nœuds : anneaux et carrés s'interrompent, le nœud reste net. -->
    <mask id="magic-circle-jours" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <rect width="400" height="400" fill="#ffffff"/>
      <g fill="#000000">
        <circle cx="200" cy="50" r="10"/>
        <circle cx="306.1" cy="93.9" r="10"/>
        <circle cx="350" cy="200" r="10"/>
        <circle cx="306.1" cy="306.1" r="10"/>
        <circle cx="200" cy="350" r="10"/>
        <circle cx="93.9" cy="306.1" r="10"/>
        <circle cx="50" cy="200" r="10"/>
        <circle cx="93.9" cy="93.9" r="10"/>
      </g>
    </mask>

    <!-- Trame principale (traits forts) : servie deux fois, floutée en halo puis nette. -->
    <g id="magic-circle-trame" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="200" cy="200" r="185" stroke-width="3.6"/>
      <g mask="url(#magic-circle-jours)">
        <circle cx="200" cy="200" r="157" stroke-width="2.4"/>
        <circle cx="200" cy="200" r="150" stroke-width="2.2"/>
        <path d="M200 50 L350 200 L200 350 L50 200 Z" stroke-width="3"/>
        <rect x="93.9" y="93.9" width="212.1" height="212.1" stroke-width="3"/>
      </g>
      <circle cx="200" cy="200" r="106" stroke-width="3.2"/>
    </g>

    <!-- Glyphes de la bande, dessinés en haut du cercle : centrés en (200, 29.5), soit r = 170.5,
         l'axe vertical suit le rayon. Le trait (blanc, 2.2) vient du groupe qui les pose. -->
    <g id="magic-circle-g1"><circle cx="200" cy="25.8" r="3.3"/><path d="M200 29.1 V37 M196.4 33.4 H203.6"/></g>
    <g id="magic-circle-g2"><path d="M200 22 L205.6 31.6 H194.4 Z"/><circle cx="200" cy="35.6" r="1.5" fill="#ffffff" stroke="none"/></g>
    <g id="magic-circle-g3"><path d="M200 22 L205.2 29.5 L200 37 L194.8 29.5 Z M194.8 29.5 H205.2"/></g>
    <g id="magic-circle-g4"><path d="M195 27 L200 22 L205 27 M195 31.5 L200 26.5 L205 31.5 M200 26.5 V37"/></g>
    <g id="magic-circle-g5"><path d="M194.6 22.6 A5.4 5.4 0 0 0 205.4 22.6"/><circle cx="200" cy="32.6" r="4.2"/></g>
    <g id="magic-circle-g6"><path d="M195 22.5 H205 L195 36.5 H205 Z"/></g>
    <g id="magic-circle-g7"><circle cx="200" cy="27.5" r="4.8"/><circle cx="200" cy="27.5" r="1.4" fill="#ffffff" stroke="none"/><path d="M200 32.3 V37"/></g>
    <g id="magic-circle-g8"><path d="M195 23.5 H205 M195 29.5 H198.4 M201.6 29.5 H205 M195 35.5 H205"/></g>
    <g id="magic-circle-g9"><path d="M200 25 L204.2 29.5 L200 34 L195.8 29.5 Z"/><circle cx="200" cy="21.8" r="1.4" fill="#ffffff" stroke="none"/><circle cx="200" cy="37.2" r="1.4" fill="#ffffff" stroke="none"/></g>
    <g id="magic-circle-g10"><path d="M194.4 29.5 Q200 21.5 205.6 29.5 Q200 37.5 194.4 29.5 Z"/><circle cx="200" cy="29.5" r="1.5" fill="#ffffff" stroke="none"/></g>
    <g id="magic-circle-g11"><circle cx="200" cy="29.5" r="2.8"/><path d="M200 22.2 V24.4 M200 34.6 V36.8 M192.7 29.5 H194.9 M205.1 29.5 H207.3"/></g>
    <g id="magic-circle-g12"><circle cx="200" cy="29.5" r="5.6"/><circle cx="200" cy="29.5" r="2.2"/></g>

    <!-- Étoile à quatre branches qui sépare les quarts de la bande (0°, 90°, 180°, 270°). -->
    <path id="magic-circle-etoile-bande" d="M200 21 Q201.4 28.1 207 29.5 Q201.4 30.9 200 38 Q198.6 30.9 193 29.5 Q198.6 28.1 200 21 Z"/>
    <!-- Points entre les glyphes : un quart (5° à 85°), tourné quatre fois. -->
    <g id="magic-circle-points-quart">
      <circle cx="200" cy="29.5" r="1.5" transform="rotate(5 200 200)"/>
      <circle cx="200" cy="29.5" r="1.5" transform="rotate(15 200 200)"/>
      <circle cx="200" cy="29.5" r="1.5" transform="rotate(25 200 200)"/>
      <circle cx="200" cy="29.5" r="1.5" transform="rotate(35 200 200)"/>
      <circle cx="200" cy="29.5" r="1.5" transform="rotate(45 200 200)"/>
      <circle cx="200" cy="29.5" r="1.5" transform="rotate(55 200 200)"/>
      <circle cx="200" cy="29.5" r="1.5" transform="rotate(65 200 200)"/>
      <circle cx="200" cy="29.5" r="1.5" transform="rotate(75 200 200)"/>
      <circle cx="200" cy="29.5" r="1.5" transform="rotate(85 200 200)"/>
    </g>

    <!-- Nœud d'un sommet de l'étoile (r = 150). -->
    <g id="magic-circle-noeud">
      <circle cx="200" cy="50" r="6.5" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="2.4"/>
      <circle cx="200" cy="50" r="2.4" fill="#ffffff"/>
    </g>
    <!-- Lune dans la pointe du haut (r = 124) : contour gris, partie éclairée blanche. -->
    <circle id="magic-circle-lune" cx="200" cy="76" r="8" fill="none" stroke="#d2d2d2" stroke-width="1.6"/>
    <path id="magic-circle-gibbeuse" d="M200 68 A8 8 0 0 1 200 84 A4.5 8 0 0 1 200 68 Z"/>
    <path id="magic-circle-quartier" d="M200 68 A8 8 0 0 1 200 84 Z"/>
    <path id="magic-circle-croissant" d="M200 68 A8 8 0 0 1 200 84 A4.5 8 0 0 0 200 68 Z"/>
    <!-- Petite étoile d'une encoche entre deux pointes (r = 134). -->
    <path id="magic-circle-etoile-encoche" d="M200 59.5 Q201 65 204.5 66 Q201 67 200 72.5 Q199 67 195.5 66 Q199 65 200 59.5 Z"/>
    <!-- Losanges du bord (r = 188), grand et petit. -->
    <path id="magic-circle-losange" d="M200 5 L204 12 L200 19 L196 12 Z"/>
    <path id="magic-circle-losange-petit" d="M200 7.5 L202.8 12 L200 16.5 L197.2 12 Z"/>
    <!-- Rose des vents : moitié claire de chaque branche (une longue, une courte). -->
    <path id="magic-circle-rose-longue" d="M200 200 L200 128 L205.7 186.1 Z"/>
    <path id="magic-circle-rose-courte" d="M200 200 L232.5 167.5 L213.9 194.3 Z"/>
    <g id="magic-circle-points-coeur">
      <circle cx="200" cy="111" r="1.6"/>
      <circle cx="200" cy="111" r="1.6" transform="rotate(15 200 200)"/>
      <circle cx="200" cy="111" r="1.6" transform="rotate(30 200 200)"/>
      <circle cx="200" cy="111" r="1.6" transform="rotate(45 200 200)"/>
      <circle cx="200" cy="111" r="1.6" transform="rotate(60 200 200)"/>
      <circle cx="200" cy="111" r="1.6" transform="rotate(75 200 200)"/>
    </g>
  </defs>

  <!-- 1. Voiles très légers : le disque se lit encore en petit et prend la teinte du palier. -->
  <circle cx="200" cy="200" r="171" fill="none" stroke="#ffffff" stroke-width="28" stroke-opacity="0.06"/>
  <path d="M200 50 L350 200 L200 350 L50 200 Z" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="93.9" y="93.9" width="212.1" height="212.1" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="200" cy="200" r="106" fill="url(#magic-circle-coeur)"/>

  <!-- 2. Halo : la trame floutée sous les traits nets. -->
  <use href="#magic-circle-trame" filter="url(#magic-circle-halo)" opacity="0.7"/>

  <!-- 3. Traits secondaires gris : anneaux fins et graduation (un trait tous les 5°). -->
  <g fill="none" stroke="#d2d2d2">
    <circle cx="200" cy="200" r="190" stroke-width="1.6"/>
    <circle cx="200" cy="200" r="114.8" stroke-width="1.4"/>
    <circle cx="200" cy="200" r="97" stroke-width="1.4"/>
    <circle cx="200" cy="200" r="153.5" stroke-width="5" stroke-dasharray="1.3 12.1" mask="url(#magic-circle-jours)"/>
  </g>

  <!-- 4. Trame nette. -->
  <use href="#magic-circle-trame"/>

  <!-- 5. Bande de glyphes : quatre étoiles aux points cardinaux, 32 glyphes, points entre eux. -->
  <g fill="#ffffff">
    <use href="#magic-circle-etoile-bande"/>
    <use href="#magic-circle-etoile-bande" transform="rotate(90 200 200)"/>
    <use href="#magic-circle-etoile-bande" transform="rotate(180 200 200)"/>
    <use href="#magic-circle-etoile-bande" transform="rotate(270 200 200)"/>
  </g>
  <g fill="#e6e6e6">
    <use href="#magic-circle-points-quart"/>
    <use href="#magic-circle-points-quart" transform="rotate(90 200 200)"/>
    <use href="#magic-circle-points-quart" transform="rotate(180 200 200)"/>
    <use href="#magic-circle-points-quart" transform="rotate(270 200 200)"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <use href="#magic-circle-g2" transform="rotate(10 200 200)"/>
    <use href="#magic-circle-g7" transform="rotate(20 200 200)"/>
    <use href="#magic-circle-g4" transform="rotate(30 200 200)"/>
    <use href="#magic-circle-g10" transform="rotate(40 200 200)"/>
    <use href="#magic-circle-g1" transform="rotate(50 200 200)"/>
    <use href="#magic-circle-g6" transform="rotate(60 200 200)"/>
    <use href="#magic-circle-g11" transform="rotate(70 200 200)"/>
    <use href="#magic-circle-g9" transform="rotate(80 200 200)"/>
    <use href="#magic-circle-g5" transform="rotate(100 200 200)"/>
    <use href="#magic-circle-g12" transform="rotate(110 200 200)"/>
    <use href="#magic-circle-g3" transform="rotate(120 200 200)"/>
    <use href="#magic-circle-g8" transform="rotate(130 200 200)"/>
    <use href="#magic-circle-g2" transform="rotate(140 200 200)"/>
    <use href="#magic-circle-g7" transform="rotate(150 200 200)"/>
    <use href="#magic-circle-g10" transform="rotate(160 200 200)"/>
    <use href="#magic-circle-g4" transform="rotate(170 200 200)"/>
    <use href="#magic-circle-g11" transform="rotate(190 200 200)"/>
    <use href="#magic-circle-g1" transform="rotate(200 200 200)"/>
    <use href="#magic-circle-g9" transform="rotate(210 200 200)"/>
    <use href="#magic-circle-g6" transform="rotate(220 200 200)"/>
    <use href="#magic-circle-g5" transform="rotate(230 200 200)"/>
    <use href="#magic-circle-g3" transform="rotate(240 200 200)"/>
    <use href="#magic-circle-g12" transform="rotate(250 200 200)"/>
    <use href="#magic-circle-g8" transform="rotate(260 200 200)"/>
    <use href="#magic-circle-g10" transform="rotate(280 200 200)"/>
    <use href="#magic-circle-g4" transform="rotate(290 200 200)"/>
    <use href="#magic-circle-g2" transform="rotate(300 200 200)"/>
    <use href="#magic-circle-g11" transform="rotate(310 200 200)"/>
    <use href="#magic-circle-g7" transform="rotate(320 200 200)"/>
    <use href="#magic-circle-g1" transform="rotate(330 200 200)"/>
    <use href="#magic-circle-g9" transform="rotate(340 200 200)"/>
    <use href="#magic-circle-g6" transform="rotate(350 200 200)"/>
  </g>

  <!-- 6. Losanges du bord : grands aux points cardinaux, petits entre eux. -->
  <g fill="#ffffff">
    <use href="#magic-circle-losange"/>
    <use href="#magic-circle-losange" transform="rotate(90 200 200)"/>
    <use href="#magic-circle-losange" transform="rotate(180 200 200)"/>
    <use href="#magic-circle-losange" transform="rotate(270 200 200)"/>
    <use href="#magic-circle-losange-petit" transform="rotate(45 200 200)"/>
    <use href="#magic-circle-losange-petit" transform="rotate(135 200 200)"/>
    <use href="#magic-circle-losange-petit" transform="rotate(225 200 200)"/>
    <use href="#magic-circle-losange-petit" transform="rotate(315 200 200)"/>
  </g>

  <!-- 7. Nœuds aux huit sommets. -->
  <use href="#magic-circle-noeud"/>
  <use href="#magic-circle-noeud" transform="rotate(45 200 200)"/>
  <use href="#magic-circle-noeud" transform="rotate(90 200 200)"/>
  <use href="#magic-circle-noeud" transform="rotate(135 200 200)"/>
  <use href="#magic-circle-noeud" transform="rotate(180 200 200)"/>
  <use href="#magic-circle-noeud" transform="rotate(225 200 200)"/>
  <use href="#magic-circle-noeud" transform="rotate(270 200 200)"/>
  <use href="#magic-circle-noeud" transform="rotate(315 200 200)"/>

  <!-- 8. Phases de lune dans les pointes, dans le sens du cercle : pleine, décroissante, nouvelle, croissante. -->
  <g fill="#ffffff">
    <use href="#magic-circle-lune"/>
    <circle cx="200" cy="76" r="8"/>
    <use href="#magic-circle-lune" transform="rotate(45 200 200)"/>
    <use href="#magic-circle-gibbeuse" transform="rotate(45 200 200) translate(400 0) scale(-1 1)"/>
    <use href="#magic-circle-lune" transform="rotate(90 200 200)"/>
    <use href="#magic-circle-quartier" transform="rotate(90 200 200) translate(400 0) scale(-1 1)"/>
    <use href="#magic-circle-lune" transform="rotate(135 200 200)"/>
    <use href="#magic-circle-croissant" transform="rotate(135 200 200) translate(400 0) scale(-1 1)"/>
    <use href="#magic-circle-lune" transform="rotate(180 200 200)"/>
    <circle cx="200" cy="76" r="8" fill-opacity="0.14" transform="rotate(180 200 200)"/>
    <use href="#magic-circle-lune" transform="rotate(225 200 200)"/>
    <use href="#magic-circle-croissant" transform="rotate(225 200 200)"/>
    <use href="#magic-circle-lune" transform="rotate(270 200 200)"/>
    <use href="#magic-circle-quartier" transform="rotate(270 200 200)"/>
    <use href="#magic-circle-lune" transform="rotate(315 200 200)"/>
    <use href="#magic-circle-gibbeuse" transform="rotate(315 200 200)"/>
  </g>

  <!-- 9. Petites étoiles dans les encoches, grandes et petites en alternance. -->
  <g fill="#ffffff">
    <use href="#magic-circle-etoile-encoche" transform="rotate(22.5 200 200)"/>
    <use href="#magic-circle-etoile-encoche" transform="rotate(67.5 200 200) translate(200 66) scale(0.7) translate(-200 -66)"/>
    <use href="#magic-circle-etoile-encoche" transform="rotate(112.5 200 200)"/>
    <use href="#magic-circle-etoile-encoche" transform="rotate(157.5 200 200) translate(200 66) scale(0.7) translate(-200 -66)"/>
    <use href="#magic-circle-etoile-encoche" transform="rotate(202.5 200 200)"/>
    <use href="#magic-circle-etoile-encoche" transform="rotate(247.5 200 200) translate(200 66) scale(0.7) translate(-200 -66)"/>
    <use href="#magic-circle-etoile-encoche" transform="rotate(292.5 200 200)"/>
    <use href="#magic-circle-etoile-encoche" transform="rotate(337.5 200 200) translate(200 66) scale(0.7) translate(-200 -66)"/>
  </g>

  <!-- 10. Cœur (sous l'orbe) : couronne de points, rose des vents, anneau et point central. -->
  <g fill="#ffffff">
    <use href="#magic-circle-points-coeur"/>
    <use href="#magic-circle-points-coeur" transform="rotate(90 200 200)"/>
    <use href="#magic-circle-points-coeur" transform="rotate(180 200 200)"/>
    <use href="#magic-circle-points-coeur" transform="rotate(270 200 200)"/>
  </g>
  <path d="M200 128 L205.7 186.1 L232.5 167.5 L213.9 194.3 L272 200 L213.9 205.7 L232.5 232.5 L205.7 213.9 L200 272 L194.3 213.9 L167.5 232.5 L186.1 205.7 L128 200 L186.1 194.3 L167.5 167.5 L194.3 186.1 Z" fill="#ffffff" fill-opacity="0.06" stroke="#d2d2d2" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="#ffffff" fill-opacity="0.4">
    <use href="#magic-circle-rose-longue"/>
    <use href="#magic-circle-rose-longue" transform="rotate(90 200 200)"/>
    <use href="#magic-circle-rose-longue" transform="rotate(180 200 200)"/>
    <use href="#magic-circle-rose-longue" transform="rotate(270 200 200)"/>
    <use href="#magic-circle-rose-courte"/>
    <use href="#magic-circle-rose-courte" transform="rotate(90 200 200)"/>
    <use href="#magic-circle-rose-courte" transform="rotate(180 200 200)"/>
    <use href="#magic-circle-rose-courte" transform="rotate(270 200 200)"/>
  </g>
  <circle cx="200" cy="200" r="11" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <circle cx="200" cy="200" r="3.5" fill="#ffffff"/>
</svg>
