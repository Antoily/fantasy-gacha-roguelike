<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Emblème Légendaire : gemme orange sertie d'or, coiffée d'une petite couronne.
       Quatrième échelon : ornements (serti, couronne), halo doré et deux étincelles.
       Lumière en haut à gauche ; contour encre 5, 3,5 pour la couronne (plus petite). -->
  <defs>
    <radialGradient id="rarity-legendary-halo" cx="32" cy="36" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a3" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#ffcb52" stop-opacity="0.75"/>
      <stop offset="0.85" stop-color="#ffaa2b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/>
    </radialGradient>
    <circle id="rarity-legendary-serti" cx="32" cy="39.5" r="20.5"/>
    <clipPath id="rarity-legendary-serti-clip"><use href="#rarity-legendary-serti"/></clipPath>
    <circle id="rarity-legendary-gemme" cx="32" cy="39.5" r="13"/>
    <clipPath id="rarity-legendary-gemme-clip"><use href="#rarity-legendary-gemme"/></clipPath>
    <path id="rarity-legendary-couronne" d="M20.5 23.5 L18.5 9.5 L26 15 L32 6 L38 15 L45.5 9.5 L43.5 23.5 Q32 27 20.5 23.5 Z"/>
    <clipPath id="rarity-legendary-couronne-clip"><use href="#rarity-legendary-couronne"/></clipPath>
  </defs>

  <!-- Halo doré -->
  <circle cx="32" cy="36" r="28" fill="url(#rarity-legendary-halo)"/>

  <!-- Serti d'or -->
  <use href="#rarity-legendary-serti" fill="#ffd447"/>
  <g clip-path="url(#rarity-legendary-serti-clip)">
    <path d="M0 50 C14 33.5 30 21.5 50 13.5 L50 0 L0 0 Z" fill="#fff0a3"/>
    <path d="M64 19.5 C52 39.5 40 51.5 14 63.5 L64 64 Z" fill="#c38d3a"/>
    <path d="M16.5 35.4 A16 16 0 0 1 25.2 25" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Gemme taillée en brillant, vue de dessus -->
  <use href="#rarity-legendary-gemme" fill="#ff9f1c"/>
  <g clip-path="url(#rarity-legendary-gemme-clip)">
    <polygon points="32,39.5 48.6,32.6 48.6,46.4" fill="#e2621e"/>
    <polygon points="32,39.5 48.6,46.4 38.9,56.1" fill="#a93a2c"/>
    <polygon points="32,39.5 38.9,56.1 25.1,56.1" fill="#e2621e"/>
    <polygon points="32,39.5 15.4,46.4 15.4,32.6" fill="#ffbe4a"/>
    <polygon points="32,39.5 15.4,32.6 25.1,22.9" fill="#ffd98c"/>
    <polygon points="32,39.5 25.1,22.9 38.9,22.9" fill="#ffbe4a"/>
    <!-- Table : moitié haut-gauche plus claire -->
    <polygon points="38.5,42.2 34.7,46 29.3,46 25.5,42.2 25.5,36.8 29.3,33 34.7,33 38.5,36.8" fill="#ffad33"/>
    <polygon points="25.5,42.2 25.5,36.8 29.3,33 34.7,33" fill="#ffc457"/>
    <!-- Arêtes -->
    <path d="M38.5 42.2 L44 44.5 M34.7 46 L37 51.5 M29.3 46 L27 51.5 M25.5 42.2 L20 44.5 M25.5 36.8 L20 34.5 M29.3 33 L27 27.5 M34.7 33 L37 27.5 M38.5 36.8 L44 34.5" fill="none" stroke="#a93a2c" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.5"/>
    <polygon points="38.5,42.2 34.7,46 29.3,46 25.5,42.2 25.5,36.8 29.3,33 34.7,33 38.5,36.8" fill="none" stroke="#a93a2c" stroke-width="1.1" stroke-linejoin="round" stroke-opacity="0.5"/>
    <!-- Reflets -->
    <path d="M22.4 36 A10.2 10.2 0 0 1 28.5 29.9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="30.4" cy="35" r="1.2" fill="#ffffff"/>
    <!-- Liseré de contre-jour -->
    <path d="M42.4 42.3 A10.8 10.8 0 0 1 34.8 49.9" fill="none" stroke="#ffd07a" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <use href="#rarity-legendary-gemme" fill="none" stroke="#1d1a16" stroke-width="2"/>
  <use href="#rarity-legendary-serti" fill="none" stroke="#1d1a16" stroke-width="5"/>

  <!-- Couronne -->
  <use href="#rarity-legendary-couronne" fill="#ffd447"/>
  <g clip-path="url(#rarity-legendary-couronne-clip)">
    <polygon points="10,0 30.5,0 27,30 10,30" fill="#fff0a3"/>
    <polygon points="38,0 52,0 52,30 39.5,30" fill="#c38d3a"/>
  </g>
  <use href="#rarity-legendary-couronne" fill="none" stroke="#1d1a16" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Bandeau et ses pierres -->
  <path d="M19.6 17.5 Q32 21.5 44.4 17.5" fill="none" stroke="#1d1a16" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="32" cy="21.9" rx="2.3" ry="1.6" fill="#ff9f1c" stroke="#1d1a16" stroke-width="1.1"/>
  <circle cx="25.3" cy="21.2" r="1" fill="#fff0a3" stroke="#1d1a16" stroke-width="0.9"/>
  <circle cx="38.7" cy="21.2" r="1" fill="#ffd447" stroke="#1d1a16" stroke-width="0.9"/>
  <!-- Perles des pointes -->
  <circle cx="18.5" cy="9.5" r="2.3" fill="#ffe27a" stroke="#1d1a16" stroke-width="1.8"/>
  <circle cx="32" cy="6" r="2.5" fill="#ffe27a" stroke="#1d1a16" stroke-width="1.8"/>
  <circle cx="45.5" cy="9.5" r="2.3" fill="#ffe27a" stroke="#1d1a16" stroke-width="1.8"/>
  <circle cx="31.3" cy="5.3" r="0.8" fill="#ffffff"/>

  <!-- Étincelles -->
  <path d="M54.5 8.5 Q55.7 13.8 61 15 Q55.7 16.2 54.5 21.5 Q53.3 16.2 48 15 Q53.3 13.8 54.5 8.5 Z" fill="#ffffff" stroke="#1d1a16" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M9 20.5 Q9.8 24.2 13.5 25 Q9.8 25.8 9 29.5 Q8.2 25.8 4.5 25 Q8.2 24.2 9 20.5 Z" fill="#fff6cf" stroke="#1d1a16" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
