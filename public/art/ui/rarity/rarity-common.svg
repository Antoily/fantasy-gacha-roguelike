<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Emblème Commun : galet gris poli (charte § 4 et § 8, fiche rarity).
       Premier échelon : forme basse et ronde, ni facette ni éclat, seulement du volume et
       un poli. Lumière en haut à gauche, contour encre 5 (≈ 2 px affichés). -->
  <defs>
    <path id="rarity-common-galet" d="M12.5 38.5 C11 30 18.5 22.5 30.5 21.5 C43 20.5 52.5 26 52.5 34.5 C52.5 43.5 44 49.5 32 50 C20 50.5 13.5 46 12.5 38.5 Z"/>
    <clipPath id="rarity-common-galet-clip"><use href="#rarity-common-galet"/></clipPath>
  </defs>

  <!-- Aplat de base -->
  <use href="#rarity-common-galet" fill="#b8b2a7"/>
  <g clip-path="url(#rarity-common-galet-clip)">
    <!-- Lumière chaude le long du bord haut-gauche -->
    <path d="M8 47 L8 14 L58 14 L58 26.5 C49 24 38 24.5 29.5 27.5 C21 30.5 15 36.5 12.5 45 Z" fill="#e3ddcf"/>
    <!-- Ombre propre à bord net, décalée vers le violet -->
    <path d="M57 22 C52 33 44 38.5 33 41 C25 42.8 17 42.5 10 39 L10 60 L60 60 L60 22 Z" fill="#7d7489"/>
    <!-- Occlusion au contact, en bas -->
    <path d="M60 36 C52 41 44 44.6 33 45.6 C26 46.2 20 45.4 14 43 L12 62 L62 62 L62 36 Z" fill="#595365"/>
    <!-- Mouchetures de la pierre (visibles de près seulement) -->
    <circle cx="38.5" cy="32.5" r="1.1" fill="#9e97a0"/>
    <circle cx="42.8" cy="35.8" r="0.8" fill="#9e97a0"/>
    <circle cx="27.5" cy="36.6" r="1" fill="#9e97a0"/>
    <circle cx="45.5" cy="40.6" r="1" fill="#625a6f"/>
    <!-- Poli : reflet principal et petit reflet -->
    <path d="M17.5 34.5 C18.2 29.6 22.8 26.6 28.8 26 C24.6 28.6 21.8 31.2 21 34.8 Z" fill="#ffffff"/>
    <circle cx="34" cy="26" r="1.6" fill="#ffffff"/>
  </g>
  <!-- Contour de silhouette -->
  <use href="#rarity-common-galet" fill="none" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
</svg>
