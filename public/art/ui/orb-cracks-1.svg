<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Fissures, palier 1 : deux fissures fines partent du point d'impact (140,98).
       Calque transparent posé exactement sur orb.svg ; lumière en blanc (le jeu la teinte),
       bordée d'un fin trait encre. Les paliers 2 et 3 reprennent ces lignes, élargies. -->
  <defs>
    <clipPath id="orb-cracks-1-clip"><circle cx="120" cy="120" r="97"/></clipPath>
    <filter id="orb-cracks-1-lueur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <radialGradient id="orb-cracks-1-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="orb-cracks-1-reseau">
      <path d="M141,99.1 150.1,90.8 153.9,79.7 163.8,71.5 166.6,60.3 175.4,50.3 179.3,42.1 178.7,41.9 174.6,49.7 165.4,59.7 162.2,70.5 152.1,78.3 147.9,89.2 139,96.9Z"/>
      <path d="M139.1,96.9 130.1,104.3 126.4,114.4 116.6,118.5 111.8,128.8 101,133 112.2,129.2 117.4,119.5 127.6,115.6 131.9,105.7 140.9,99.1Z"/>
      <circle cx="140" cy="98" r="2.4"/>
