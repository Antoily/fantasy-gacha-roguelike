    <use href="#orb-cracks-1-reseau" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" opacity="0.55" filter="url(#orb-cracks-1-lueur)"/>
    <use href="#orb-cracks-1-reseau" fill="#1d1a16" stroke="#1d1a16" stroke-width="2.6" stroke-linejoin="round"/>
    <use href="#orb-cracks-1-reseau" fill="#ffffff"/>
  </g>
</svg>
