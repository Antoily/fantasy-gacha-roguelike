<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Flèche épaisse vers la droite, bleu ciel des boutons (#7ec8e3), en biseau : moitié haute
       claire, moitié basse ombrée, arêtes basses plus sombres. Le jeu la retourne pour la gauche :
       lumière et ombre portée sont donc verticales (symétriques gauche / droite). -->
  <defs>
    <path id="icon-arrow-forme" d="M9.5 21.5 L28.5 21.5 L28.5 11.5 Q28.5 7.5 31.7 10 L55.4 28.5 Q58.5 31 55.4 33.5 L31.7 52 Q28.5 54.5 28.5 50.5 L28.5 40.5 L9.5 40.5 Q5.5 40.5 5.5 36.5 L5.5 25.5 Q5.5 21.5 9.5 21.5 Z"/>
    <clipPath id="icon-arrow-clip"><use href="#icon-arrow-forme"/></clipPath>
  </defs>

  <!-- Ombre portée (verticale). -->
  <use href="#icon-arrow-forme" transform="translate(0 3)" fill="#1d1a16" opacity="0.2"/>

  <use href="#icon-arrow-forme" fill="#7ec8e3"/>
  <g clip-path="url(#icon-arrow-clip)">
    <!-- Moitié basse dans l'ombre, arêtes basses plus sombres. -->
    <rect x="0" y="31" width="64" height="33" fill="#5ca6dd"/>
    <path d="M5.5 40.5 L28.5 40.5 M28.5 54.5 L58.5 31" fill="none" stroke="#4682cf" stroke-width="9"/>
    <!-- Arêtes hautes et côtés tournés vers la gauche : éclairés. -->
    <path d="M5.5 21.5 L28.5 21.5 M28.5 7.5 L58.5 31 M28.5 7.5 L28.5 21.5 M5.5 21.5 L5.5 30" fill="none" stroke="#c4ecf9" stroke-width="10"/>
    <!-- Reflets blancs. -->
    <path d="M10.5 25.6 L21 25.6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="24.6" cy="25.6" r="1.3" fill="#ffffff"/>
    <path d="M33 15.5 L42.8 23.3" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <use href="#icon-arrow-forme" fill="none" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
</svg>
