<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Étoile de rareté dorée, pointes arrondies, taillée en biseau : chaque branche est un toit à
       deux pans, le pan tourné vers la lumière (haut gauche) clair, l'autre orangé.
       Même langage que tout le jeu d'icônes (contour 5, ombre portée 20 %, reflets blancs). -->
  <defs>
    <path id="icon-star-forme" d="M30.2 9.8 Q32 6 33.8 9.8 L40 22.5 L54 24.4 Q58.2 25 55.1 27.9 L44.9 37.7 L47.4 51.6 Q48.2 55.7 44.5 53.8 L32 47.1 L19.5 53.8 Q15.8 55.7 16.6 51.6 L19.1 37.7 L8.9 27.9 Q5.8 25 10 24.4 L24 22.5 Z"/>
    <clipPath id="icon-star-clip"><use href="#icon-star-forme"/></clipPath>
  </defs>

  <!-- Ombre portée. -->
  <use href="#icon-star-forme" transform="translate(1.5 3)" fill="#1d1a16" opacity="0.2"/>

  <use href="#icon-star-forme" fill="#ffc93c"/>
  <g clip-path="url(#icon-star-clip)">
    <!-- Dix pans, du centre (32 ; 33,5) vers pointes et creux. -->
    <polygon points="32,33.5 24,22.5 32,6" fill="#ffe27a"/>
    <polygon points="32,33.5 32,6 40,22.5" fill="#f5a52c"/>
    <polygon points="32,33.5 40,22.5 58.2,25" fill="#fff0a3"/>
    <polygon points="32,33.5 58.2,25 44.9,37.7" fill="#e3831f"/>
    <polygon points="32,33.5 44.9,37.7 48.2,55.7" fill="#fbb534"/>
    <polygon points="32,33.5 48.2,55.7 32,47.1" fill="#ffc93c"/>
    <polygon points="32,33.5 32,47.1 15.8,55.7" fill="#e3831f"/>
    <polygon points="32,33.5 15.8,55.7 19.1,37.7" fill="#fff0a3"/>
    <polygon points="32,33.5 19.1,37.7 5.8,25" fill="#f5a52c"/>
    <polygon points="32,33.5 5.8,25 24,22.5" fill="#ffd85a"/>
    <!-- Liseré de contre-jour sur la branche du bas à droite. -->
    <path d="M44.3 41.5 L45.6 49.6" fill="none" stroke="#ffe27a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Reflet principal qui suit l'épaule haut gauche, point nerveux. -->
    <path d="M15.5 26.8 L23.2 25.8 Q25.6 25.4 26.6 23.2 L29.9 17.2" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="31" cy="13.2" r="1.3" fill="#ffffff"/>
  </g>

  <use href="#icon-star-forme" fill="none" stroke="#1d1a16" stroke-width="5" stroke-linejoin="round"/>
</svg>
